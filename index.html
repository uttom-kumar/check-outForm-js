<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout Form</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background: #f4f6f8;
      }
      .container-box {
        max-width: 700px;
        background: #fff;
        margin: 40px auto;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
      }
      .required::after {
        content: " *";
        color: red;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="container-box">
        <h3 class="text-center mb-4">Checkout Form</h3>

        <form class="needs-validation" novalidate>
          <!-- First Name -->
          <div class="mb-3">
            <label class="form-label required">First Name</label>
            <input
              type="text"
              class="form-control"
              id="fname"
              required
              minlength="5"
            />
            <div class="invalid-feedback">Minimum 5 characters required.</div>
          </div>

          <!-- Email -->
          <div class="mb-3">
            <label class="form-label required">Email</label>
            <input type="email" class="form-control" required />
            <div class="invalid-feedback">Enter a valid email address.</div>
          </div>

          <!-- Country -->
          <div class="mb-3">
            <label class="form-label required">Country</label>
            <select class="form-select" required>
              <option value="">Select Country</option>
              <option>Bangladesh</option>
              <option>India</option>
              <option>USA</option>
              <option>UK</option>
            </select>
            <div class="invalid-feedback">Please select a country.</div>
          </div>

          <!-- Credit Card -->
          <div class="mb-3">
            <label class="form-label required">Credit Card Number</label>
            <input type="number" class="form-control" required />
            <div class="invalid-feedback">
              Credit card number must be 16 digits.
            </div>
          </div>

          <!-- Expire Date -->
          <div class="mb-3">
            <label class="form-label required">Expire Date</label>
            <input type="date" class="form-control" required />
            <div class="invalid-feedback">Select expire date.</div>
          </div>

          <!-- Payment Method -->
          <div class="mb-3">
            <label class="form-label required">Payment Method</label>

            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="payment"
                id="creditCard"
                required
              />
              <label class="form-check-label" for="creditCard">Credit Card</label>
            </div>

            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="payment"
                id="bkash"
                required
              />
              <label class="form-check-label" for="bkash">bKash</label>
            </div>

            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="payment"
                id="cashDelivery"
                required
              />
              <label class="form-check-label" for="cashDelivery">Cash On Delivery</label>
            </div>

            <div class="invalid-feedback d-block">
              Please select a payment method.
            </div>
          </div>

          <button class="btn btn-primary w-100" type="submit">
            Submit Order
          </button>
        </form>
      </div>
    </div>

    <!-- Bootstrap Validation JS -->
    <script>
      (() => {
        // Arrow function: set invalid
        const setInvalid = (field) => {
          field.classList.add("is-invalid");
          field.classList.remove("is-valid");
        };

        // Arrow function: set valid
        const setValid = (field) => {
          field.classList.add("is-valid");
          field.classList.remove("is-invalid");
        };

        // Arrow function: validate form
        const validateForm = (form) => {
          let isFormValid = true;

          // Fields
          const fname = form.querySelector("#fname");
          const email = form.querySelector('input[type="email"]');
          const country = form.querySelector("select");
          const card = form.querySelector('input[type="number"]');
          const date = form.querySelector('input[type="date"]');
          const payments = form.querySelectorAll('input[name="payment"]');

          // First name (min 5)
          if (fname.value.trim().length < 5) {
            setInvalid(fname);
            isFormValid = false;
          } else {
            setValid(fname);
          }

          // Email
          const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
          if (!emailPattern.test(email.value.trim())) {
            setInvalid(email);
            isFormValid = false;
          } else {
            setValid(email);
          }

          // Country
          if (country.value === "") {
            setInvalid(country);
            isFormValid = false;
          } else {
            setValid(country);
          }

          // Credit Card (16 digits)
          if (card.value.length !== 16) {
            setInvalid(card);
            isFormValid = false;
          } else {
            setValid(card);
          }

          // Expire Date
          if (date.value === "") {
            setInvalid(date);
            isFormValid = false;
          } else {
            setValid(date);
          }

          // Payment (radio)
          let paymentSelected = false;
          payments.forEach((p) => {
            if (p.checked) paymentSelected = true;
          });

          if (!paymentSelected) {
            isFormValid = false;
          }

          return isFormValid;
        };

        // Submit handler
        const initFormValidation = () => {
          const form = document.querySelector(".needs-validation");

          form.addEventListener("submit", (e) => {
            e.preventDefault();

            if (validateForm(form)) {
              alert("✅ Form Submitted Successfully!");
              form.reset();
              form.querySelectorAll(".is-valid").forEach((el) => {
                el.classList.remove("is-valid");
              });
            }
          });
        };

        // Start
        initFormValidation();
      })();
    </script>
  </body>
</html>
